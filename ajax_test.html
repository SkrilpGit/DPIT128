<!DOCTYPE html>

<!-- AJAX Test File; Created by Jason Rodriguez -->

<html lang="en">

  <head>

    <meta charset="utf-8">

    <title>DPIT128: AJAX Test File</title>

    <style>

      #output-div {
        color: #518bbf;
        font-family: "trebuchet ms";
      }

      body {
        background-color: #ededed;
        text-align: center;
      }

      hr {
        border: none;
        border-top: 1px dashed #939393;
        margin-bottom: 20px;
        margin-top: 20px;
      }

      input {
        background-color: #ecf2f4;
        border-radius: 3px;
        color: #45565c;
        margin-bottom: 8px;
        padding: 10px;
        width: 100px;
      }

      input:focus {
        box-shadow: 0px 0px 1px 1px #808080;
        outline: none;
      }

      input:hover {
        cursor: pointer;
      }

    </style>

    <script>

      function processRequest()
      {
        const xhrObject = new XMLHttpRequest();

        xhrObject.onreadystatechange = function ()
        {
          if (this.readyState == 4 && this.status == 200)
          {
            processResponse(this.responseXML);
          }
        };

        xhrObject.open("get", "xml_file.xml", true);

        xhrObject.send();
      }

      function processResponse(xmlTree)
      {
        var output = "<h1>Welcome to " + xmlTree.getElementsByTagName("subject")[0].getAttribute("code") + "!</h1>";

        output += "<h2>This subject is titled \"" + xmlTree.getElementsByTagName("title")[0].childNodes[0].nodeValue + "\".</h2>";

        document.getElementById("output-div").innerHTML = output;
      }

    </script>

  </head>

  <body>

    <h1>IIS Express Confirmation</h1>

    <hr>

    <h2>Simple AJAX Tester</h2>

    <input type="button" value="Start" onclick="processRequest();" autofocus>

    <div id="output-div"></div>

    <hr>

    <p>&copy; <a href="mailto:jasonr@uow.edu.au?subject=Question(s)%20about%20%22Simple%20AJAX%20Tester%22">Jason Rodriguez</a></p>

  </body>

</html>
